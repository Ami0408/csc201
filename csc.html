<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSC 201: 150 Question Review</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 10px;
        }

        .controls {
            position: sticky;
            top: 0;
            background: var(--bg);
            padding: 15px 0;
            z-index: 100;
            border-bottom: 1px solid #ddd;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: space-between;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            background: white;
        }

        .card-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 5px solid var(--accent);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .category-tag {
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7f8c8d;
            margin-bottom: 8px;
            display: block;
            font-weight: bold;
        }

        .question-text {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .answer-box {
            background-color: #e8f6f3;
            padding: 15px;
            border-radius: 6px;
            color: #0e6655;
            display: none; /* Hidden by default */
            margin-top: 10px;
        }

        .toggle-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
        }

        .toggle-btn:hover {
            background-color: #1a252f;
        }

        /* Stats */
        .stats {
            text-align: right;
            font-size: 0.9em;
            color: #7f8c8d;
            margin-top: 5px;
        }
    </style>
</head>
<body>

        <h1>CSC 201 Ultimate Review</h1>
        <p>150 Questions from Lectures 1-7</p>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search for keywords (e.g., 'tuple', 'loop', 'slice')..." onkeyup="filterQuestions()">
        <select id="topicFilter" onchange="filterQuestions()">
            <option value="all">All Lectures</option>

            <option value="Lecture 6">Lecture 6: Lists</option>
            <option value="Lecture 7">Lecture 7: Tuples/Dicts</option>
        </select>
    </div>

    <div class="stats" id="countDisplay">Showing 150 questions</div>
    <div class="card-grid" id="quizContainer">
        </div>
</div>

    const quizContainer = document.getElementById('quizContainer');
    const countDisplay = document.getElementById('countDisplay');

    function renderQuestions(filter = 'all', search = '') {
        quizContainer.innerHTML = '';
        
        let filtered = questions.filter(item => {
            const matchesTopic = filter === 'all' || item.topic === filter;
            const matchesSearch = item.q.toLowerCase().includes(search.toLowerCase()) || 
                                  item.a.toLowerCase().includes(search.toLowerCase());
            return matchesTopic && matchesSearch;
        });

        countDisplay.innerText = `Showing ${filtered.length} question${filtered.length !== 1 ? 's' : ''}`;

        filtered.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <span class="category-tag">${item.topic}</span>
                <div class="question-text">${item.id}. ${item.q}</div>
                <button class="toggle-btn" onclick="toggleAnswer(this)">Show Answer</button>
                <div class="answer-box">${item.a}</div>
            `;
            quizContainer.appendChild(card);
        });
    }

    function toggleAnswer(btn) {
        const answerBox = btn.nextElementSibling;
        if (answerBox.style.display === 'block') {
            answerBox.style.display = 'none';
            btn.innerText = 'Show Answer';
            btn.style.backgroundColor = '#2c3e50';
        } else {
            answerBox.style.display = 'block';
            btn.innerText = 'Hide Answer';
            btn.style.backgroundColor = '#e74c3c';
        }
    }

    function filterQuestions() {
        const topic = document.getElementById('topicFilter').value;
        const search = document.getElementById('searchInput').value;
        renderQuestions(topic, search);
    }

    // Initial load
    renderQuestions();

</script>

</body>
</html>
